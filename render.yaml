databases:
  - name: supermarket-db
    databaseName: supermarket
    user: supermarket_user
    plan: free

services:
  - type: web
    name: supermarket-billing-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: supermarket-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: supermarket-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: supermarket-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: supermarket-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: supermarket-db
          property: password
